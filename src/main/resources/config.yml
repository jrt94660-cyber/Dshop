# Global currency symbols and number formatting only.
currency:
  symbol: "$"
  symbols:
    VAULT: "$"
    COINSENGINE:
      shards: "✦"
      default: "✦"
    EXCELENTECONOMY:
      shards: "✦"
      default: "✦"
  format: "#,##0.##"

price-format:
  enabled: true
  decimal-pattern: "#,##0.##"
  suffixes:
    - "k"
    - "m"
    - "b"
    - "t"
    - "q"
    - "qq"
