name: Dshop
version: 1.0.39
main: com.flovex.dshop.Dshop
api-version: '1.21'
softdepend: [Vault, CoinsEngine, ExcellentEconomy]
commands:
  sell:
    description: Opens Dshop's built-in sell menu
    usage: /sell [top|worth|reload]
  shardshop:
    description: Opens the Shards shop directly
    usage: /shardshop
  shop:
    description: Opens and manages Dshop
    usage: /shop
permissions:
  dshop.admin:
    default: op
  dshop.use:
    default: true
